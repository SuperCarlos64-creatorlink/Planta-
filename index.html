<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limpia el Árbol</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#a2d2ff; font-family:'Press Start 2P', monospace; text-align:center; overflow:hidden; }
  h1 { font-size:12px; margin-top:20px; }
  #juego { position:relative; width:300px; height:400px; margin:20px auto; background:#b5e48c; border:4px solid #000; }
  #arbol { font-size:100px; position:absolute; bottom:50px; left:50%; transform:translateX(-50%); }
  .item { position:absolute; font-size:24px; cursor:pointer; animation: caer 3s linear infinite; }
  @keyframes caer { from{top:-30px} to{top:380px} }
  #barra { width:300px; height:20px; border:3px solid #000; margin:10px auto; background:white; }
  #progreso { height:100%; width:0%; background:#2b9348; transition:0.3s; }
  button { font-family:'Press Start 2P'; padding:15px; background:#ffbe0b; border:3px solid #000; cursor:pointer; box-shadow:4px 4px 0 #000; }
  button:active { transform:translate(2px,2px); box-shadow:2px 2px 0 #000; }
  #win { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); color:#fff; z-index:10; flex-direction:column; justify-content:center; align-items:center; }
  #win h2 { font-size:32px; color:#ffff3f; text-shadow:4px 4px 0 #ff006e; line-height:1.5; animation: pop 0.5s infinite alternate; }
  @keyframes pop { from{transform:scale(1)} to{transform:scale(1.1)} }
</style>
</head>
<body>
<h1>LIMPIA EL ÁRBOL</h1>
<div id="barra"><div id="progreso"></div></div>
<p style="font-size:10px"><span id="pct">0</span>% LIMPIO</p>

<div id="juego">
  <div id="arbol">🌳</div>
</div>

<button id="btnBasura">🗑️ RECOGER BASURA</button>

<div id="win">
  <h2>MUY<br>BIEN!</h2>
  <p style="margin-top:20px; font-size:10px">¡SALVASTE AL ARBOL!</p>
  <button onclick="location.reload()" style="margin-top:20px">JUGAR DE NUEVO</button>
</div>

<script>
let porcentaje = 0;
let juego = document.getElementById('juego');
let progreso = document.getElementById('progreso');
let pctTxt = document.getElementById('pct');
let win = document.getElementById('win');

const basuras = ['🗑️','🧴','🥤','🛍️','🧃','🍂','💨'];

function crearBasura(){
  let b = document.createElement('div');
  b.className = 'item';
  b.textContent = basuras[Math.floor(Math.random()*basuras.length)];
  b.style.left = Math.random()*260 + 'px';
  b.style.top = '-30px';
  juego.appendChild(b);
  setTimeout(()=>{ if(b.parentNode) b.remove() }, 3000);
}

setInterval(crearBasura, 400);

document.getElementById('btnBasura').addEventListener('click', ()=>{
  let items = document.querySelectorAll('.item');
  if(items.length>0){
    items.forEach(i=>{
      i.textContent = '✨';
      setTimeout(()=>i.remove(), 200);
    });
    porcentaje += 15;
    if(porcentaje>100) porcentaje=115;
    progreso.style.width = Math.min(porcentaje,100)+'%';
    pctTxt.textContent = porcentaje;

    if(porcentaje>=100){
      win.style.display='flex';
    }
  }
});
</script>
</body>
</html>
