<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbol Pixel</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#87CEEB;font-family:'Press Start 2P',monospace;text-align:center}
  h1{font-size:11px;margin:15px 0}
  #barra{width:300px;height:22px;border:4px solid #000;margin:0 auto;background:#fff;box-shadow:4px 4px 0 #000}
  #progreso{height:100%;width:0%;background:#00b600;transition:width 0.3s}
  #progreso.negativo{background:#ff0000!important}
  #pct{font-size:10px;margin:8px 0;display:block}
  #juego{position:relative;width:320px;height:380px;margin:15px auto;background:#a7e174;border:4px solid #000;box-shadow:6px 6px 0 #000;overflow:hidden;transition:0.5s}
  #juego.feo{background:#5a3e2b!important}
  #arbol{font-size:110px;position:absolute;bottom:40px;left:50%;transform:translateX(-50%);z-index:1;transition:0.5s}
  .flor{position:absolute;font-size:20px;z-index:2}
  .basura{position:absolute;font-size:22px;z-index:3;animation:caer 5s linear forwards}
  @keyframes caer{from{top:-30px}to{top:360px}}
  #botones{display:flex;justify-content:center;gap:8px;width:340px;margin:10px auto}
  .btn{font-family:'Press Start 2P';font-size:7px;padding:12px 6px;border:3px solid #000;box-shadow:3px 3px 0 #000;cursor:pointer;flex:1}
  .btn:disabled{background:#888!important;color:#222!important;box-shadow:none!important}
  #btnPlantar{background:#ffbe0b}
  #btnRegar{background:#00b4d8;color:#fff}
  #btnBasura{background:#3a86ff;color:#fff}
  .pantalla{display:none;position:fixed;inset:0;z-index:99;flex-direction:column;justify-content:center;align-items:center;color:#fff}
  #win{background:#000}
  #lose{background:#2b0000}
  .pantalla h2{font-size:42px;text-shadow:6px 6px 0 #000;line-height:1.2;animation:brilla 0.4s infinite alternate}
  #win h2{color:#ffbe0b;text-shadow:6px 6px 0 #ff006e}
  #lose h2{color:#ff0000;text-shadow:6px 6px 0 #000}
  @keyframes brilla{from{transform:scale(1)}to{transform:scale(1.2)}}
  .gota{position:absolute;color:#00b4d8;font-size:18px;animation:lluvia 0.8s linear;z-index:10}
  @keyframes lluvia{from{top:0;opacity:1}to{top:300px;opacity:0}}
</style>
</head>
<body>
<h1>ARBOlITO PIXEL</h1>
<div id="barra"><div id="progreso"></div></div>
<span id="pct">0% LIMPIO</span>
<div id="juego"><div id="arbol">🌳</div></div>
<div id="botones">
  <button class="btn" id="btnPlantar">🌸 PLANTAR</button>
  <button class="btn" id="btnRegar">💧 REGAR</button>
  <button class="btn" id="btnBasura" disabled>🗑️ VACIO</button>
</div>

<div id="win" class="pantalla">
  <h2>MUY<br>BIEN!</h2>
  <p style="font-size:10px;margin-top:15px">¡LO SALVASTE!</p>
  <button class="btn" style="margin-top:20px;background:#fff" onclick="location.reload()">REINICIAR</button>
</div>

<div id="lose" class="pantalla">
  <h2 style="font-size:28px">¡PERDISTE!</h2>
  <p style="font-size:40px;margin:15px">🪾</p>
  <p style="font-size:9px">EL ARBOL MURIO<br>POR LA BASURA</p>
  <button class="btn" style="margin-top:20px;background:#fff" onclick="location.reload()">REINTENTAR</button>
</div>

<script>
let juego=document.getElementById('juego');
let arbol=document.getElementById('arbol');
let btnPlantar=document.getElementById('btnPlantar');
let btnRegar=document.getElementById('btnRegar');
let btnBasura=document.getElementById('btnBasura');
let progreso=document.getElementById('progreso');
let pctTxt=document.getElementById('pct');
let win=document.getElementById('win');
let lose=document.getElementById('lose');
let porcentaje=0;
let juegoTerminado=false;

function actualizarArbol(){
  if(porcentaje <= -40){
    arbol.textContent='🪾'; // arbol seco pelon
    juego.classList.add('feo');
  } else if(porcentaje <= -20){
    arbol.textContent='🌲'; // arbol triste
    juego.classList.remove('feo');
  } else if(porcentaje >= 50){
    arbol.textContent='🌳';
    juego.classList.remove('feo');
  } else {
    arbol.textContent='🌳';
    juego.classList.remove('feo');
  }
}

function actualizarUI(){
  if(juegoTerminado) return;
  if(porcentaje>115) porcentaje=115;

  // barra
  if(porcentaje<=0){
    progreso.style.width='5%';
    progreso.classList.add('negativo');
    pctTxt.style.color='red';
  } else {
    progreso.style.width=Math.min(porcentaje,100)+'%';
    progreso.classList.remove('negativo');
    pctTxt.style.color='black';
  }
  
  pctTxt.textContent=porcentaje+'% LIMPIO';
  
  let total=document.querySelectorAll('.basura').length;
  if(!btnBasura.dataset.cooldown){
    btnBasura.disabled = total===0;
    btnBasura.textContent = total===0 ? '🗑️ VACIO' : `🗑️ ${total}`;
  }

  actualizarArbol();

  if(porcentaje>=100){
    juegoTerminado=true;
    win.style.display='flex';
  }
  if(porcentaje<=-50){
    juegoTerminado=true;
    lose.style.display='flex';
  }
}

function ponerEnRecarga(btn, textoFinal){
  btn.dataset.cooldown="1";
  btn.disabled=true;
  let t=5;
  btn.textContent=t+"s";
  let timer=setInterval(()=>{
    t--;
    if(t>0){ btn.textContent=t+"s"; }
    else {
      clearInterval(timer);
      delete btn.dataset.cooldown;
      btn.textContent=textoFinal;
      btn.disabled=false;
      actualizarUI();
    }
  },1000);
}

btnPlantar.addEventListener('click',()=>{
  let f=document.createElement('div');
  f.className='flor'; f.textContent='🌸';
  f.style.left=(90+Math.random()*140)+'px';
  f.style.top=(50+Math.random()*130)+'px';
  juego.appendChild(f);
  ponerEnRecarga(btnPlantar,"🌸 PLANTAR");
});

btnRegar.addEventListener('click',()=>{
  for(let i=0;i<4;i++){
    let g=document.createElement('div');
    g.className='gota'; g.textContent='💧';
    g.style.left=(80+Math.random()*160)+'px';
    juego.appendChild(g);
    setTimeout(()=>g.remove(),800);
  }
  document.querySelectorAll('.flor').forEach(f=>{
    let s=parseInt(f.style.fontSize)||20;
    f.style.fontSize=(s+6)+'px';
  });
  arbol.style.transform='translateX(-50%) scale(1.2)';
  setTimeout(()=>arbol.style.transform='translateX(-50%) scale(1)',300);
  porcentaje+=5;
  actualizarUI();
  ponerEnRecarga(btnRegar,"💧 REGAR");
});

setInterval(()=>{
  if(juegoTerminado) return;
  let b=document.createElement('div');
  b.className='basura';
  b.textContent=['🗑️','🧴','🥤','🍂'][Math.floor(Math.random()*4)];
  b.style.left=Math.random()*280+'px';
  juego.appendChild(b);
  setTimeout(()=>{
    if(b.parentNode && !juegoTerminado){
      b.remove();
      porcentaje-=10;
      actualizarUI();
    }
  },5000);
  actualizarUI();
},1600);

btnBasura.addEventListener('click',()=>{
  let todas=document.querySelectorAll('.basura');
  if(todas.length===0) return;
  todas.forEach(el=>{el.textContent='✨'; setTimeout(()=>el.remove(),120);});
  porcentaje+=25;
  actualizarUI();
  ponerEnRecarga(btnBasura,"🗑️ VACIO");
});

actualizarUI();
</script>
</body>
</html>
