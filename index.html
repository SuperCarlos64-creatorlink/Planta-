<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbol Pixel</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#87CEEB;font-family:'Press Start 2P',monospace;text-align:center}
  h1{font-size:11px;margin:15px 0}
  #barra{width:300px;height:22px;border:4px solid #000;margin:0 auto;background:#fff;box-shadow:4px 4px 0 #000}
  #progreso{height:100%;width:0%;background:#00b600;transition:width 0.3s}
  #pct{font-size:10px;margin:8px 0;display:block}
  #juego{position:relative;width:320px;height:380px;margin:15px auto;background:#a7e174;border:4px solid #000;box-shadow:6px 6px 0 #000;overflow:hidden}
  #arbol{font-size:110px;position:absolute;bottom:40px;left:50%;transform:translateX(-50%);z-index:1;transition:0.5s}
  .flor{position:absolute;font-size:20px;z-index:2;transition:0.5s}
  .basura{position:absolute;font-size:22px;z-index:3;animation:caer 5s linear}
  @keyframes caer{from{top:-30px}to{top:360px}}
  #botones{display:flex;justify-content:center;gap:8px;width:340px;margin:10px auto}
  .btn{font-family:'Press Start 2P';font-size:7px;padding:12px 6px;border:3px solid #000;box-shadow:3px 3px 0 #000;cursor:pointer;flex:1}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
  #btnPlantar{background:#ffbe0b}
  #btnRegar{background:#00b4d8;color:#fff}
  #btnBasura{background:#3a86ff;color:#fff}
  #btnBasura:disabled{background:#888;color:#444;box-shadow:none;cursor:not-allowed}
  #win{display:none;position:fixed;inset:0;background:#000;z-index:99;flex-direction:column;justify-content:center;align-items:center;color:#fff}
  #win h2{font-size:42px;color:#ffbe0b;text-shadow:6px 6px 0 #ff006e;line-height:1.2;animation:brilla 0.4s infinite alternate}
  @keyframes brilla{from{transform:scale(1)}to{transform:scale(1.2)}}
  .gota{position:absolute;color:#00b4d8;font-size:18px;animation:lluvia 0.8s linear;z-index:10}
  @keyframes lluvia{from{top:0;opacity:1}to{top:300px;opacity:0}}
</style>
</head>
<body>
<h1>ARBOlITO PIXEL</h1>
<div id="barra"><div id="progreso"></div></div>
<span id="pct">0% LIMPIO</span>

<div id="juego"><div id="arbol">🌳</div></div>

<div id="botones">
  <button class="btn" id="btnPlantar">🌸 PLANTAR</button>
  <button class="btn" id="btnRegar">💧 REGAR</button>
  <button class="btn" id="btnBasura" disabled>🗑️ 0</button>
</div>

<div id="win">
  <h2>MUY<br>BIEN!</h2>
  <p style="font-size:10px;margin-top:20px">¡ARBOl AL 100%!</p>
  <button class="btn" style="margin-top:20px;background:#fff" onclick="location.reload()">REINICIAR</button>
</div>

<script>
let juego=document.getElementById('juego');
let arbol=document.getElementById('arbol');
let btnPlantar=document.getElementById('btnPlantar');
let btnRegar=document.getElementById('btnRegar');
let btnBasura=document.getElementById('btnBasura');
let progreso=document.getElementById('progreso');
let pctTxt=document.getElementById('pct');
let win=document.getElementById('win');
let porcentaje=0;

function actualizarUI(){
  let total=document.querySelectorAll('.basura').length;
  btnBasura.textContent=`🗑️ ${total}`;
  btnBasura.disabled=total===0;
  progreso.style.width=Math.min(porcentaje,100)+'%';
  pctTxt.textContent=porcentaje+'% LIMPIO';
  if(porcentaje>=100) win.style.display='flex';
}

btnPlantar.addEventListener('click',()=>{
  let f=document.createElement('div');
  f.className='flor'; f.textContent='🌸';
  f.style.left=(90+Math.random()*140)+'px';
  f.style.top=(50+Math.random()*130)+'px';
  f.style.fontSize='20px';
  juego.appendChild(f);
  actualizarUI();
});

btnRegar.addEventListener('click',()=>{
  // efecto de lluvia
  for(let i=0;i<5;i++){
    let g=document.createElement('div');
    g.className='gota'; g.textContent='💧';
    g.style.left=(80+Math.random()*160)+'px';
    juego.appendChild(g);
    setTimeout(()=>g.remove(),800);
  }
  // flores crecen
  document.querySelectorAll('.flor').forEach(f=>{
    let size=parseInt(f.style.fontSize)||20;
    f.style.fontSize=(size+8)+'px';
    if(f.textContent==='🌸') f.textContent='🌺';
  });
  // arbol crece un poco
  arbol.style.transform='translateX(-50%) scale(1.15)';
  setTimeout(()=>arbol.style.transform='translateX(-50%) scale(1)',300);
  porcentaje+=5;
  actualizarUI();
});

setInterval(()=>{
  let b=document.createElement('div');
  b.className='basura';
  b.textContent=['🗑️','🧴','🥤','🍂'][Math.floor(Math.random()*4)];
  b.style.left=Math.random()*280+'px';
  juego.appendChild(b);
  setTimeout(()=>{if(b.parentNode){b.remove(); actualizarUI();}},5000);
  actualizarUI();
},1800);

btnBasura.addEventListener('click',()=>{
  let todas=document.querySelectorAll('.basura');
  todas.forEach(el=>{el.textContent='✨'; setTimeout(()=>el.remove(),150);});
  porcentaje+=todas.length*15;
  if(porcentaje>115) porcentaje=115;
  actualizarUI();
});
</script>
</body>
</html>
